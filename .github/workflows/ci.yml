name: Tests

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    env:
      # Headless-CI: Qt ohne Display, GPU-Tests werden per Marker uebersprungen
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: System-Bibliotheken (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon0 libdbus-1-3 ffmpeg

      - name: Abhaengigkeiten installieren (gepinnt)
        run: pip install -r requirements.lock

      - name: Tests (ohne GPU-Tests)
        run: pytest tests/ -m "not gpu" -q
